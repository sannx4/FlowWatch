name: FlowWatch V7 Day2 Financial Intelligence
on:
  pull_request:
    paths:
      - 'src/api/day2/**'
      - 'tests/unit/test_day2_financial_api.py'
      - 'requirements-api.txt'
      - 'frontend/**'
      - 'scripts/day2_init_auth.py'
      - '.github/workflows/day2-financial-intelligence.yml'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  day2-api-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt -r requirements-api.txt
      - name: Offline API auth and financial contracts
        run: python -m pytest -q tests/unit/test_day2_financial_api.py
  day2-react-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build frontend
        run: npm run build
